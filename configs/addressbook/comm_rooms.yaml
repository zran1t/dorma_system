# =====================================================================
# File: configs/addressbook/comm_rooms.yaml
# 說明：
#   • 全系統「通訊房間 (Comm Room)」通訊錄
#   • 只有會收/發封包的終端點（Comm Room），不含 dispatch/watch/group
#   • 封包器/解包器據此做：path → actor_id 反查、from/to 驗證
# =====================================================================

version: "v1.0.0"
updated_at: "2025-10-23T00:00:00Z"

naming:
  actor_id_regex: "^[a-z][a-z0-9_]{2,48}$"

# 路徑樣式（fallback 模糊比對；精準優先於模糊）
role_patterns:
  dpt_comm_room:
    - "/dpt_comm_room/"
    - "/comm_room/"
  kol_comm_room:
    - "/kol_comm_room/"

# ───────────────────────────────────────────────────────────────
# 部門索引（速查；KOL 以 glob 路徑發現，不強行列舉）
# ───────────────────────────────────────────────────────────────
index:
  - dept: "initialization"
    roots: ["dorma_system/initialization_dpt/**"]
    kol_globs: ["dorma_system/initialization_dpt/kols/**"]

  - dept: "data"
    roots: ["dorma_system/data_dpt/**"]
    kol_globs: ["dorma_system/data_dpt/kols/**"]

  - dept: "risk"
    roots: ["dorma_system/risk_dpt/**"]
    kol_globs: ["dorma_system/risk_dpt/kols/**"]

  - dept: "strategy"
    roots: ["dorma_system/strategy_dpt/**"]
    kol_globs: ["dorma_system/strategy_dpt/kols/**"]

  - dept: "state"
    roots: ["dorma_system/state_dpt/**"]
    kol_globs: ["dorma_system/state_dpt/kols/**"]

  - dept: "capital"
    roots: ["dorma_system/capital_dpt/**"]
    kol_globs: ["dorma_system/capital_dpt/kols/**"]

  - dept: "place_orders"
    roots: ["dorma_system/place_orders_dpt/**"]
    kol_globs: ["dorma_system/place_orders_dpt/kols/**"]

# =====================================================================
# 權威清單：Comm Rooms（只有會收/發封包的終端點）
#   • from / to 一律使用這裡的 actor_id
#   • code_paths 支援多 glob；封包器可用首個命中的條目
# =====================================================================
actors:

  # ======== 部門層 DPT Comm Rooms ========
  - actor_id: "initialization_dpt_comm_room"
    type: "DPT_COMM_ROOM"
    department: "initialization"
    code_paths: ["dorma_system/initialization_dpt/dpt_comm_room/**"]

  - actor_id: "data_dpt_comm_room"
    type: "DPT_COMM_ROOM"
    department: "data"
    code_paths: ["dorma_system/data_dpt/dpt_comm_room/**"]

  - actor_id: "risk_dpt_comm_room"
    type: "DPT_COMM_ROOM"
    department: "risk"
    code_paths: ["dorma_system/risk_dpt/comm_room/**"]

  - actor_id: "strategy_dpt_comm_room"
    type: "DPT_COMM_ROOM"
    department: "strategy"
    code_paths: ["dorma_system/strategy_dpt/comm_room/**"]

  - actor_id: "state_dpt_comm_room"
    type: "DPT_COMM_ROOM"
    department: "state"
    code_paths: ["dorma_system/state_dpt/comm_room/**"]

  - actor_id: "capital_dpt_comm_room"
    type: "DPT_COMM_ROOM"
    department: "capital"
    code_paths: ["dorma_system/capital_dpt/dpt_comm_room/**"]

  - actor_id: "place_orders_dpt_comm_room"
    type: "DPT_COMM_ROOM"
    department: "place_orders"
    code_paths: ["dorma_system/place_orders_dpt/dpt_comm_room/**"]

  # ======== KOL 層 Comm Rooms（data 部）========
  - actor_id: "data_hf_market_data_kol_comm_room"
    type: "KOL_COMM_ROOM"
    department: "data"
    code_paths: ["dorma_system/data_dpt/kols/hf_market_data_kol/kol_comm_room/**"]

  - actor_id: "data_lf_market_data_kol_comm_room"
    type: "KOL_COMM_ROOM"
    department: "data"
    code_paths: ["dorma_system/data_dpt/kols/lf_market_data_kol/kol_comm_room/**"]

  - actor_id: "data_ref_data_kol_comm_room"
    type: "KOL_COMM_ROOM"
    department: "data"
    code_paths: ["dorma_system/data_dpt/kols/ref_data_kol/kol_comm_room/**"]

  - actor_id: "data_account_data_kol_comm_room"
    type: "KOL_COMM_ROOM"
    department: "data"
    code_paths: ["dorma_system/data_dpt/kols/account_data_kol/kol_comm_room/**"]

  # ======== KOL 層 Comm Rooms（initialization 部）========
  - actor_id: "initialization_init_lf_data_kol_comm_room"
    type: "KOL_COMM_ROOM"
    department: "initialization"
    code_paths: ["dorma_system/initialization_dpt/kols/init_lf_data_kol/kol_comm_room/**"]

# =====================================================================
# 註：
# 1) 只收錄 Comm Rooms，因為訊息路由只會在 Comm ↔ Comm 之間流動；
#    Dispatch/Watch/Group 僅作內部協作，不是對外路由邊界。
# 2) 若未來要避免列出大量 KOL，可保留 index.kol_globs 作啟動期掃描，
#    由封包器把掃描結果寫入內存快取（必要時落地 KV），但權威仍以本檔為準。
# =====================================================================
