# File: configs/symbol_mapping/system_presets/market_data.startup.yaml
#
# 職責 (Responsibility):
#     定義系統啟動時的 Market Data「訂閱矩陣 (Startup Matrix)」，用以宣告：
#       - 以 exchange 為邊界：各交易所需啟用哪些市場資料訂閱
#       - 以 pair + market 為訂閱單位：spot / swap / index 可同時存在
#       - feeds 採 defaults + only-diff override：降低重複並維持可讀性
#
# 注意事項 (Notes):
#     - 本檔僅描述「訂閱意圖」，實際可訂閱能力由 loader/validator 依 adapter 能力表驗證
#     - loader 契約：
#         1) exchanges.<ex>.symbols[*].markets.<market> 存在即表示啟用該 market
#         2) 先取 exchanges.<ex>.defaults.<market> 作為 base config
#         3) 再將 markets.<market> 內容做深度覆寫 (only-diff override)
#     - market 定義：
#         spot : 現貨市場（trades/book/bbo/last...）
#         swap : 永續合約市場（trades/book/bbo/last/mark...）
#         index: 指數市場（index realtime/candle...）
#
version: 1

summary: "啟動訂閱矩陣：以 exchange 為邊界，宣告各市場的 market data 訂閱意圖"

exchanges:
  okx:
    defaults:
      spot:
        feeds:
          trades_all: { enabled: true }
          trades:     { enabled: true }
          bbo:        { enabled: true }
          book_delta: { enabled: true }
          book_full:  { enabled: true }
          last:
            realtime: { enabled: true }
            candle:
              enabled: true
              intervals: [1m, 5m]

      swap:
        feeds:
          trades_all: { enabled: true }
          trades:     { enabled: true }
          bbo:        { enabled: true }
          book_delta: { enabled: true }
          book_full:  { enabled: true }
          last:
            realtime: { enabled: true }
            candle:
              enabled: true
              intervals: [1m, 5m]
          mark:
            realtime: { enabled: true }
            candle:
              enabled: true
              intervals: [1m, 5m, 15m]

      index:
        feeds:
          index:
            realtime: { enabled: true }
            candle:
              enabled: true
              intervals: [1m, 5m]

    symbols:
      - pair: BTC-USDT
        markets:
          spot: {}
          swap: {}
          index: {}

      - pair: ETH-USDT
        markets:
          spot: {}
          swap: {}
          index: {}

  binance: {}
