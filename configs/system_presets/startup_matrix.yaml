# File: configs/system_presets/startup_matrix.yaml
# 說明：啟動組態，宣告要開哪些交易所、哪些交易對(symbols)、與哪些 feed。
# 規則：幣種用 BASE-QUOTE（不帶 -SWAP / -INDEX），後綴由系統規則注入。
#       price.last.*, price.mark.*, hf.* → -SWAP；price.index.* → -INDEX

version: 1

# 簡短摘要，長篇說明請放 README 或程式檔頭註解
summary: "宣告 exchange / symbol 要開啟的 hf 與 price feed，支援 defaults 覆寫"

# A) 全域 intervals 能力（供 candle 使用）
intervals:
  available: [1m, 3m, 5m, 15m, 30m, 1H, 2H, 4H, 6H, 12H, 1D, 2D, 3D, 5D, 1W, 1M, 3M, 1Y]

# B) 本次啟用的交易所（程式需已支援；交易所能力驗證留給 validator）
exchanges_enabled: [okx]

# C) 預設值（symbols 未覆寫就用這裡）
defaults:
  hf:
    trades_all: true
    trades:     true
    bbo:        true
    book_delta: true
    book_full:  true

  price:
    last:
      tick: true
      candle: { enabled: true, intervals: [1m, 3m, 5m, 15m] }
    index:
      tick: true
      candle: { enabled: true, intervals: [1m, 3m, 5m, 15m] }
    mark:
      tick: true
      candle: { enabled: true, intervals: [1m, 3m, 5m, 15m, 30m] }

# D) 幣種與 feed 開關（只寫與 defaults 不同的地方，其他沿用 defaults）
symbols:
  - pair: BTC-USDT
    # 完全沿用 defaults，不寫也行，這裡留白就是要表明「吃預設」

  - pair: ETH-USDT
    price:
      last:
        candle: { enabled: true, intervals: [1m, 3m, 5m, 15m, 30m, 1H] }  # 只覆寫 differ 部分

  - pair: BNB-USDT
    price:
      # 示範：全部沿用 defaults，不額外覆寫

  - pair: XRP-USDT
    price:
      index:
        candle: { enabled: true, intervals: [1m, 3m, 5m] }  # 比 defaults 少

  - pair: SOL-USDT
    # 沒有特別需求 → 全吃 defaults

  - pair: ADA-USDT
    # 沒有特別需求 → 全吃 defaults

  - pair: DOGE-USDT
    # 沒有特別需求 → 全吃 defaults

  - pair: MATIC-USDT
    # 沒有特別需求 → 全吃 defaults

  - pair: DOT-USDT
    # 沒有特別需求 → 全吃 defaults

  - pair: LTC-USDT
    # 沒有特別需求 → 全吃 defaults
