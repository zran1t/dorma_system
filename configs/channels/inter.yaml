# File: configs/channels/inter.yaml
# Module: configs.channels.inter
#
# 職責 (Responsibility):
#     定義「部門↔部門」之 system control-plane 通道拓樸，供共識破裂後之第二層一致性（部門級）使用。
#     提供 JetStream streams/consumers 的宣告式設定來源，支援 bootstrap/audit/reset 工具對拓樸進行一致性治理。
#
# 注意事項 (Notes):
#     - 本通道僅承載「行為決策類」控制訊息（propose/ack/commit/abort/flush/kill/freeze），禁止承載業務資料或狀態同步。
#     - deliver_subject 不支援萬用字元，必須為每一個部門建立獨立 consumer；部門端僅訂閱自身 deliver subject。
#     - Nats-Msg-Id 必須與 duplicates 視窗搭配，以提供共識流程在重送/重試情境下的去重保證。
#     - 依賴規範：本 YAML 僅為設定檔，不得耦合上層業務模組；解析/驗證/套用由 infra_py 工具負責。

nats:
  servers:
    - "nats://127.0.0.1:4222"

subjects:
  namespace: "inter"

  # Publisher / Subscriber 模板（部門↔部門；system control-plane）
  to_department_tpl:     "inter.dpt.{dept}.sys.in"
  to_department_deliver: "inter.dpt.{dept}.sys.in.deliver"

  # 固定部門清單（system control-plane 參與者）
  departments:
    - data
    - state
    - strategy
    - risk
    - execution

jetstream:
  streams:
    - name: "INTER_SYS_STREAM"
      subjects:
        - "inter.dpt.*.sys.in"
      storage: file
      retention: limits
      discard: old
      duplicates: 6m
      max_age: 30d

      # deny_delete: true
      # deny_purge: true

  consumers:
    # data_dpt
    - stream: "INTER_SYS_STREAM"
      name: "SYS_to_data"
      durable_name: "SYS_durable_data"
      filter_subject: "inter.dpt.data.sys.in"
      deliver_subject: "inter.dpt.data.sys.in.deliver"
      ack_policy: explicit
      ack_wait: 30s
      max_deliver: 7
      backoff: [1s, 3s, 10s, 30s]

    # state_dpt
    - stream: "INTER_SYS_STREAM"
      name: "SYS_to_state"
      durable_name: "SYS_durable_state"
      filter_subject: "inter.dpt.state.sys.in"
      deliver_subject: "inter.dpt.state.sys.in.deliver"
      ack_policy: explicit
      ack_wait: 30s
      max_deliver: 7
      backoff: [1s, 3s, 10s, 30s]

    # strategy_dpt
    - stream: "INTER_SYS_STREAM"
      name: "SYS_to_strategy"
      durable_name: "SYS_durable_strategy"
      filter_subject: "inter.dpt.strategy.sys.in"
      deliver_subject: "inter.dpt.strategy.sys.in.deliver"
      ack_policy: explicit
      ack_wait: 30s
      max_deliver: 7
      backoff: [1s, 3s, 10s, 30s]

    # risk_dpt
    - stream: "INTER_SYS_STREAM"
      name: "SYS_to_risk"
      durable_name: "SYS_durable_risk"
      filter_subject: "inter.dpt.risk.sys.in"
      deliver_subject: "inter.dpt.risk.sys.in.deliver"
      ack_policy: explicit
      ack_wait: 30s
      max_deliver: 7
      backoff: [1s, 3s, 10s, 30s]

    # execution_dpt
    - stream: "INTER_SYS_STREAM"
      name: "SYS_to_execution"
      durable_name: "SYS_durable_execution"
      filter_subject: "inter.dpt.execution.sys.in"
      deliver_subject: "inter.dpt.execution.sys.in.deliver"
      ack_policy: explicit
      ack_wait: 30s
      max_deliver: 7
      backoff: [1s, 3s, 10s, 30s]
