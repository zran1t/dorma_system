version: 1
nats:
  url: nats://127.0.0.1:4222

streams:
  - name: STREAM_INTER
    subjects: [ "bus.inter.>" ]
    storage: file
    retention: limits            # 依流量/期限保留
    discard: old                 # 超量丟最舊
    max_msgs: -1
    max_msgs_per_subject: -1
    max_bytes: -1
    max_age: 168h                # 例：保留 7 天（依需要調整）
    duplicate_window: 2m               # 去重時間窗（發佈端帶 Nats-Msg-Id）
    num_replicas: 1              # 單機=1；叢集建議=3
    allow_rollup_hdrs: true      # 允許 rollup（彙總/截斷歷史）
    allow_direct: false          # 直讀優化（需要時再開）
    deny_delete: false           # 禁刪單筆（上線可依流程改 true）
    deny_purge: false            # 禁清倉（上線可依流程改 true）

consumers:
  # 主線：部門通訊處室（只收外部→部門這一路）
  - durable: COMM_INIT_INTER
    stream: STREAM_INTER
    filter: bus.inter.dept2kol.>    # ← 只收 dept→kol
    mode: push
    deliver_subject: _AUTO
    ack_policy: explicit
    ack_wait: 30s
    max_deliver: 10
    backoff: [1s,2s,5s,10s]
    max_ack_pending: 1024
    deliver_policy: new             # ← 新部署不補歷史（可選）
    replay_policy: instant
    idle_heartbeat: 0
    flow_control: false
    rate_limit_bps: 0
    headers_only: false
    sample_freq: "0%"

  # 副線：審計/回放/備援（如果你要跟主線一致，也收 dept2kol.*）
  - durable: COMM_INIT_INTER_PEER
    stream: STREAM_INTER
    filter: bus.inter.dept2kol.>    # ← 同上，或依需求調整
    mode: push
    deliver_subject: _AUTO
    ack_policy: explicit
    ack_wait: 30s
    max_deliver: 10
    backoff: [1s,2s,5s,10s]
    max_ack_pending: 1024
    deliver_policy: new
    replay_policy: instant
    idle_heartbeat: 0
    flow_control: false
    rate_limit_bps: 0
    headers_only: false
    sample_freq: "0%"