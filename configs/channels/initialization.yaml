version: 1
nats:
  url: nats://127.0.0.1:4222

routes:
  dept_to_kol_prefix: "bus.intra.initialization.dept2kol"
  kol_to_dept_prefix: "bus.intra.initialization.kol2dept"

streams:
  - name: STREAM_INTRA_INITIALIZATION
    subjects: ["bus.intra.initialization.>"]
    storage: file
    retention: limits
    discard: old
    max_msgs: -1
    max_msgs_per_subject: -1
    max_bytes: -1
    max_age: 168h
    duplicate_window: 2m
    num_replicas: 1
    allow_rollup_hdrs: true
    allow_direct: false
    deny_delete: false
    deny_purge: false

consumers:
  # 科別通訊處室：收「部門 → 科別」
  - durable: INIT_KOL_RX
    stream: STREAM_INTRA_INITIALIZATION
    filter: bus.intra.initialization.dept2kol.>
    mode: push
    deliver_subject: _AUTO
    deliver_policy: new
    ack_policy: explicit
    ack_wait: 30s
    max_deliver: 10
    backoff: [1s, 2s, 5s, 10s]
    max_ack_pending: 1024
    replay_policy: instant
    idle_heartbeat: 0
    flow_control: false
    rate_limit_bps: 0
    headers_only: false
    sample_freq: "0%"

  # 部門通訊處室：收「科別 → 部門」
  - durable: INIT_DEPT_RX
    stream: STREAM_INTRA_INITIALIZATION
    filter: bus.intra.initialization.kol2dept.>
    mode: push
    deliver_subject: _AUTO
    deliver_policy: new
    ack_policy: explicit
    ack_wait: 30s
    max_deliver: 10
    backoff: [1s, 2s, 5s, 10s]
    max_ack_pending: 1024
    replay_policy: instant
    idle_heartbeat: 0
    flow_control: false
    rate_limit_bps: 0
    headers_only: false
    sample_freq: "0%"
