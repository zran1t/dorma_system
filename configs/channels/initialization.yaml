# configs/channels/initialization.yaml

# Initialization (department ↔ KOL) with JetStream + explicit ACK
# ─────────────────────────────────────────────────────────────────────
# ■ 使用準則（Publisher / Subscriber）
# 1) Publisher 永遠發「原始 subject」：
#    - 部門→KOL（直送）：init.dpt.initialization.kol.{kol}.comm.in
#    - KOL→部門（上行）：init.dpt.initialization.kol.{kol}.comm.out
#    - 部門廣播       ：init.dpt.initialization.broadcast
# 2) Subscriber 永遠訂閱「deliver subject」：
#    - 部門收 KOL 上行：init.dpt.initialization.comm.in.deliver
#    - KOL 收部門直送：init.dpt.initialization.kol.{kol}.comm.in.deliver
#    - KOL 收廣播    ：（由廣播 consumer 扇出 → 各 KOL 的 .comm.in.deliver）
# 3) deliver_subject 不支援萬用字元（*），因此：
#    - 直送（to_kol）與廣播（broadcast）在多 KOL 時 → 必須「每個 KOL 建一條 consumer」。
#
# ■ Headers 規範（鏡射＋去重；權威仍在 Payload/Proto）
# - Content-Type: application/x-protobuf
# - Nats-Msg-Id : {trace_id}:{hop}        # 配合 streams.duplicates 做去重
# - X-Trace-Id  : {trace_id}
# - X-Layer     : intra                    # 部門↔科別（intra）
# - X-Direction : up|down|lateral          # 列出三種；⚠ intra 不應使用 lateral（沒有 KOL↔KOL 水平）
# - X-Version   : 1.0.0
# - （若使用 Any）X-Proto-Type : {type_url}
#
# ■ JetStream 可靠性（建議統一）
# - ack_policy  : explicit（顯式 ACK）
# - ack_wait    : 30s
# - max_deliver : 5
# - backoff     : [1s, 3s, 10s, 30s]
# - duplicates  : 2m（去重視窗；對應 Nats-Msg-Id）
# - max_age     : 30d（保留期；可依空間調整）
#
# ■ 三條路徑（固定語意）
# - 廣播（部門→全部 KOL）：部門發 broadcast → JS 扇出 deliver 至各 KOL 的 .comm.in.deliver
# - 直送（部門→單一 KOL）：部門直發至該 KOL 的 .comm.in → 該 KOL 訂自己的 .deliver
# - 上行（KOL→部門匯聚）：所有 KOL 發 .comm.out → JS 匯聚 deliver 至部門唯一的 .comm.in.deliver

nats:
  servers:
    - "nats://127.0.0.1:4222"

subjects:
  namespace:  "init"
  department: "initialization_dpt"

  # 部門固定通道
  department_broadcast: "init.dpt.initialization.broadcast"     # 部門→全部 KOL（廣播）
  department_comm_in:   "init.dpt.initialization.comm.in"       # KOL→部門（上行匯聚收件匯流排）
  # department_comm_out:  "init.dpt.initialization.comm.out"    # （預留：部門對外事件；不屬於本檔語意）

  # dpt <-> kol 的模板（Publisher 用原始 subject；Subscriber 訂閱 deliver）
  to_kol_tpl:     "init.dpt.initialization.kol.{kol}.comm.in"           # 部門→單一 KOL（直送）
  to_kol_deliver: "init.dpt.initialization.kol.{kol}.comm.in.deliver"   # KOL 訂閱 deliver
  from_kol_tpl:   "init.dpt.initialization.kol.{kol}.comm.out"          # KOL→部門（上行）

  # 本部門要服務的 KOL 清單（可擴充；新增 KOL 時請複製對應的 consumers）
  kols:
    - kol

  # 展開示例（以 kol 為例）
  # 下行（廣播）： init.dpt.initialization.broadcast
  # 下行（直送）： init.dpt.initialization.kol.kol.comm.in
  # 下行（接收）： init.dpt.initialization.kol.kol.comm.in.deliver  ← KOL 端訂閱（ACK）
  # 上行（回報）： init.dpt.initialization.kol.kol.comm.out
  # 匯聚收件：     init.dpt.initialization.comm.in  ← JS deliver → *.deliver

jetstream:
  streams:
    # ① 廣播流：存部門廣播
    - name: "INIT_BROADCAST_STREAM"
      subjects: ["init.dpt.initialization.broadcast"]
      storage: file
      retention: limits
      discard: old
      duplicates: 2m
      max_age: 30d

    # ② 上行流：存所有 KOL 的回報
    - name: "INIT_KOL_OUT_STREAM"
      subjects: ["init.dpt.initialization.kol.*.comm.out"]
      storage: file
      retention: limits
      discard: old
      duplicates: 2m
      max_age: 30d

    # ③ 直送流：存部門直送到各 KOL 的指令（確保直送也走 JS + ACK）
    - name: "INIT_TO_KOL_STREAM"
      subjects: ["init.dpt.initialization.kol.*.comm.in"]
      storage: file
      retention: limits
      discard: old
      duplicates: 2m
      max_age: 30d

  consumers:
    # ── 廣播扇出（部門 → 全部 KOL）────────────────────────────────────
    # 注意：deliver_subject 不支援萬用字元（*），多 KOL 需各建一條 consumer
    - stream: "INIT_BROADCAST_STREAM"
      name: "BC_to_kol"
      durable_name: "BC_durable_kol"
      filter_subject: "init.dpt.initialization.broadcast"
      deliver_subject: "init.dpt.initialization.kol.kol.comm.in.deliver"
      ack_policy: explicit
      ack_wait: 30s
      max_deliver: 5
      backoff: [1s, 3s, 10s, 30s]

    # ── 上行匯聚（所有 KOL → 部門）───────────────────────────────────
    # JS 匯聚 → 統一 deliver 到部門 comm.in.deliver（部門只要訂這條即可）
    - stream: "INIT_KOL_OUT_STREAM"
      name: "ALL_kol_to_dpt"
      durable_name: "ALL_kOL_durable"
      filter_subject: "init.dpt.initialization.kol.*.comm.out"
      deliver_subject: "init.dpt.initialization.comm.in.deliver"
      ack_policy: explicit
      ack_wait: 30s
      max_deliver: 5
      backoff: [1s, 3s, 10s, 30s]

    # ── 直送（部門 → 單一 KOL）──────────────────────────────────────
    # 注意：同樣需要 per-KOL 一條 consumer；此處以 kol 起步
    - stream: "INIT_TO_KOL_STREAM"
      name: "DIRECT_to_kol"
      durable_name: "DIRECT_durable_kol"
      filter_subject: "init.dpt.initialization.kol.kol.comm.in"
      deliver_subject: "init.dpt.initialization.kol.kol.comm.in.deliver"
      ack_policy: explicit
      ack_wait: 30s
      max_deliver: 5
      backoff: [1s, 3s, 10s, 30s]
