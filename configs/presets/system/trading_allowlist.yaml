# File: configs/system_presets/trading_allowlist.yaml
#
# 職責 (Responsibility):
#     定義系統允許交易的「交易白名單 (Trading Allowlist)」，用以宣告：
#       - 以 exchange 為邊界：允許在哪些交易所下單
#       - 以 pair + market 為邊界：允許交易哪些標的（spot/swap...）
#       - 供 loader 產生下單風控所需的 baseline 資料需求（例如 price_limit / instruments_info）
#
# 注意事項 (Notes):
#     - 本檔是「治理 / 風控層」設定：決定哪些 instrument 可被策略/下單模組使用
#     - loader 契約（建議）：
#         1) exchanges.<ex>.symbols[*].markets.<market> 存在即代表允許交易該 market
#         2) loader 會據此觸發 baseline 需求（不可關閉）：
#              - instruments_info（合約規格/交易規則）
#              - price_limit（價格上下限/下單限制）
#         3) 若某市場不允許交易，則相關下單/風控不得使用該 instrument（即使 market data 有訂閱）
#     - market 定義（可依你的系統擴充）：
#         spot : 現貨
#         swap : 永續合約
#         futures/option/margin 等後續需要再加
#
version: 1

summary: "Trading allowlist（允許交易白名單）：以 exchange / pair / market 定義可下單標的"

exchanges:
  okx:
    symbols:
      - pair: BTC-USDT
        markets:
          spot: {}
          swap: {}

      - pair: ETH-USDT
        markets:
          spot: {}
          swap: {}

  binance: {}
